<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro — Chat21</title>
    <meta name="description" content="Crea tu cuenta en Chat21">
    <link rel="stylesheet" href="css/registro.css">
</head>

<body>
    <div class="container">
        <!-- App Icon -->
        <div class="app-icon">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
            </svg>
        </div>

        <h1>Crear cuenta</h1>
        <p class="subtitle">Únete a Chat21</p>

        <form id="registro-form">
            <div class="form-group">
                <label for="nombre">Nombre de usuario</label>
                <input type="text" id="nombre" name="nombre" placeholder="Ej: Mauri" required minlength="3" maxlength="50">
                <div class="error" id="nombre-error"></div>
            </div>

            <div class="form-group">
                <label for="email">Correo electrónico</label>
                <input type="email" id="email" name="email" placeholder="tu@email.com" required>
                <div class="error" id="email-error"></div>
            </div>

            <div class="form-group">
                <label for="edad">Edad</label>
                <input type="number" id="edad" name="edad" placeholder="Mínimo 17" required min="17" max="99">
                <div class="error" id="edad-error"></div>
            </div>

            <div class="form-group">
                <label for="pais">País</label>
                <input type="text" id="pais" name="pais" placeholder="Ej: Chile" required>
                <div class="error" id="pais-error"></div>
            </div>

            <div class="form-group">
                <label for="telefono">Teléfono <span style="font-weight:400;opacity:0.6">(opcional)</span></label>
                <input type="tel" id="telefono" name="telefono" placeholder="+56 9 1234 5678">
            </div>

            <div class="form-group">
                <label for="password">Contraseña</label>
                <input type="password" id="password" name="password" placeholder="Mínimo 6 caracteres" required minlength="6">
                <div class="error" id="password-error"></div>
            </div>

            <div class="form-group">
                <label for="password-confirm">Confirmar contraseña</label>
                <input type="password" id="password-confirm" name="password-confirm" placeholder="Repite tu contraseña" required minlength="6">
                <div class="error" id="password-confirm-error"></div>
            </div>

            <button type="submit">Crear cuenta</button>

            <div class="link-login">
                ¿Ya tienes cuenta? <a href="login.html">Inicia sesión</a>
            </div>
        </form>
    </div>

    <script type="module" src="js/registro.js"></script>
</body>
</html>
